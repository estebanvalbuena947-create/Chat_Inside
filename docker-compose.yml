# API y trabajador en el mismo servidor que n8n.
#
#   docker compose build
#   docker compose up -d
#   docker compose logs -f api
#
# El puerto se publica SOLO en local: la puerta pública la sigue haciendo nginx, que es quien
# tiene el certificado. Los secretos se leen de los .env del servidor, no de la imagen.
services:
  api:
    build: .
    image: wepflash-api
    container_name: wepflash-api
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      # Dentro del contenedor debe escuchar en todas las interfaces o el puerto publicado no
      # responde. En el servidor el .env deja el valor por defecto (solo local, detras de nginx).
      API_HOST: 0.0.0.0
    ports:
      - '127.0.0.1:4000:4000'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:4000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build: .
    image: wepflash-api
    container_name: wepflash-worker
    restart: unless-stopped
    env_file:
      - apps/worker/.env
    command: ['node', 'apps/worker/dist/main.js']
